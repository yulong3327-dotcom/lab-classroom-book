<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14275b">
  <title>开放实验室 · 3D 实验教室</title>
  <link rel="icon" type="image/svg+xml" href="./lab/favicon.svg">
  <link rel="stylesheet" href="./classroom.css">
  <link rel="stylesheet" href="./experiment-book.css">
  <script src="./lab/vendor/lucide.min.js" defer></script>
  <script type="module" src="./classroom.js"></script>
</head>
<body>
  <main id="classroom" aria-label="3D 实验教室">
    <canvas id="view" tabindex="0" aria-label="第一视角实验教室"></canvas>
    <div class="hud-top">
      <div class="identity"><span class="identity-icon"><i data-lucide="flask-conical" aria-hidden="true"></i></span><h1>开放实验室</h1></div>
      <button id="controls" class="icon-button" type="button" aria-label="控制设置" title="控制设置"><i data-lucide="settings-2" aria-hidden="true"></i></button>
    </div>
    <div id="reticle" aria-hidden="true"></div>
    <div id="marker-physics" class="marker physics" hidden><i data-lucide="zap" aria-hidden="true"></i>物理</div>
    <div id="marker-chemistry" class="marker chemistry" hidden><i data-lucide="flask-conical" aria-hidden="true"></i>化学</div>
    <div id="station" hidden>
      <span id="station-name"></span>
      <span id="book-hint"></span>
    </div>
    <div id="joystick" aria-hidden="true">
      <div class="joy-ring"></div>
      <i class="joy-north" data-lucide="chevron-up"></i><i class="joy-east" data-lucide="chevron-right"></i>
      <i class="joy-south" data-lucide="chevron-down"></i><i class="joy-west" data-lucide="chevron-left"></i>
      <div id="stick"></div>
    </div>
    <div class="touch-actions" role="group" aria-label="动作">
      <button type="button" id="sprint" aria-label="冲刺" aria-pressed="false" title="冲刺"><i data-lucide="fast-forward" aria-hidden="true"></i></button>
      <button type="button" id="jump" aria-label="跳跃" title="跳跃"><i data-lucide="arrow-up-from-line" aria-hidden="true"></i></button>
    </div>
    <div id="status" role="status" hidden></div>
  </main>
  <dialog id="experiment-book" class="experiment-book" aria-labelledby="book-index-title" data-view="index">
    <div id="book-pages" class="book-pages">
      <header class="book-top">
        <button type="button" id="book-back" class="book-button book-back book-secondary" hidden><span aria-hidden="true">←</span> 返回目录</button>
        <span class="book-imprint">开放实验室</span>
        <button type="button" class="book-icon-button" data-book-close aria-label="合上实验册">×</button>
      </header>
      <section id="book-index" class="book-index" hidden>
        <div class="book-index-intro">
          <div class="book-kicker" lang="en">CONTENTS</div>
          <h2 id="book-index-title" tabindex="-1">实验目录</h2>
          <p>选一项实验，查看器材与实验内容。</p>
          <figure class="book-index-art"><canvas width="350" height="192" data-line-field="flask" aria-hidden="true"></canvas></figure>
        </div>
        <div class="book-entries" aria-label="实验列表">
          <button type="button" class="book-entry" data-experiment="physics">
            <span class="book-entry-art"><canvas width="128" height="102" data-line-field="circuit" aria-hidden="true"></canvas></span>
            <span class="book-entry-copy"><span class="book-entry-type">物理</span><strong>探究电流与电压的关系</strong><span>组装电路、测量和记录数据</span></span>
            <span class="book-entry-arrow" aria-hidden="true">↗</span>
          </button>
          <button type="button" class="book-entry" data-experiment="chemistry">
            <span class="book-entry-art"><canvas width="128" height="102" data-line-field="flask" aria-hidden="true"></canvas></span>
            <span class="book-entry-copy"><span class="book-entry-type">化学</span><strong>高锰酸钾分解制取氧气</strong><span>装置组装、气体收集与检验</span></span>
            <span class="book-entry-arrow" aria-hidden="true">↗</span>
          </button>
        </div>
      </section>
      <article id="book-details" class="book-details" hidden>
        <header class="book-detail-heading">
          <div class="book-detail-copy">
            <div id="book-subject" class="book-kicker"></div>
            <h2 id="book-title" tabindex="-1"></h2>
            <p id="book-summary"></p>
          </div>
          <div class="book-detail-actions">
            <button type="button" id="book-free" class="book-button book-secondary" hidden>自由画布</button>
            <button type="button" id="book-start" class="book-button book-primary">去做实验 <span aria-hidden="true">↗</span></button>
          </div>
        </header>
        <div class="book-detail-grid">
          <section class="book-video" aria-labelledby="book-video-title">
            <h3 id="book-video-title">实验视频</h3>
            <video id="book-video-player" controls playsinline preload="metadata" aria-label="实验视频" hidden></video>
            <div id="book-video-placeholder" class="book-video-placeholder" role="status"><span>视频待补充</span></div>
          </section>
          <div class="book-facts">
            <section aria-labelledby="book-equipment-title">
              <h3 id="book-equipment-title">实验器材</h3>
              <ul id="book-instruments" class="book-instruments"></ul>
              <p id="book-reagents" hidden></p>
            </section>
            <section aria-labelledby="book-steps-title">
              <h3 id="book-steps-title">实验内容</h3>
              <ol id="book-steps"></ol>
            </section>
          </div>
        </div>
      </article>
    </div>
  </dialog>
  <dialog id="help" aria-labelledby="input-title">
    <button class="icon-button" id="close-help" type="button" aria-label="关闭" title="关闭"><i data-lucide="x" aria-hidden="true"></i></button>
    <h2 id="input-title">控制设置</h2>
    <h3 id="mode-title">输入方式</h3>
    <div class="modes" role="group" aria-labelledby="mode-title">
      <button type="button" data-mode="auto" aria-pressed="true">自动</button>
      <button type="button" data-mode="touch" aria-pressed="false">触控</button>
      <button type="button" data-mode="mouse" aria-pressed="false">键鼠</button>
    </div>
    <div id="size-settings">
      <h3 id="size-title">触控尺寸</h3>
      <div class="modes" role="group" aria-labelledby="size-title">
        <button type="button" data-size="small" aria-pressed="false">小</button>
        <button type="button" data-size="standard" aria-pressed="true">标准</button>
        <button type="button" data-size="large" aria-pressed="false">大</button>
      </div>
    </div>
  </dialog>
  <section id="lab" aria-label="实验操作" hidden>
    <button id="back" type="button" aria-label="返回教室" title="返回教室"><i data-lucide="arrow-left" aria-hidden="true"></i><span>返回教室</span></button>
    <div id="load-error" role="status" hidden>实验暂时打不开</div>
    <iframe id="experiment" title="实验操作"></iframe>
  </section>
</body>
</html>
